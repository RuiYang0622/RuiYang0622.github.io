<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">People and human resource strategy network</title>
  <desc id="desc">A dark strategy map connecting recruitment, development, well-being, and inclusion.</desc>
  <rect width="960" height="640" fill="#111"/>
  <text x="54" y="58" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">PEOPLE STRATEGY / 02</text>
  <text x="906" y="58" text-anchor="end" fill="#aaa" font-family="Arial,sans-serif" font-size="14">ALIGNMENT</text>
  <line x1="54" y1="93" x2="906" y2="93" stroke="#444"/>
  <text x="54" y="154" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="46">People → Strategy</text>
  <g stroke="#555" stroke-width="2">
    <line x1="480" y1="335" x2="250" y2="245"/><line x1="480" y1="335" x2="710" y2="245"/>
    <line x1="480" y1="335" x2="250" y2="465"/><line x1="480" y1="335" x2="710" y2="465"/>
  </g>
  <circle cx="480" cy="335" r="78" fill="#243b70"/>
  <circle cx="250" cy="245" r="58" fill="#d6d6cf"/><circle cx="710" cy="245" r="58" fill="#d6d6cf"/>
  <circle cx="250" cy="465" r="58" fill="#d6d6cf"/><circle cx="710" cy="465" r="58" fill="#d6d6cf"/>
  <text x="480" y="329" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="19">BUSINESS</text>
  <text x="480" y="353" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="19">OUTCOMES</text>
  <text x="250" y="250" text-anchor="middle" fill="#111" font-family="Arial,sans-serif" font-size="15">RECRUIT</text>
  <text x="710" y="250" text-anchor="middle" fill="#111" font-family="Arial,sans-serif" font-size="15">DEVELOP</text>
  <text x="250" y="470" text-anchor="middle" fill="#111" font-family="Arial,sans-serif" font-size="15">INCLUDE</text>
  <text x="710" y="470" text-anchor="middle" fill="#111" font-family="Arial,sans-serif" font-size="15">WELL-BEING</text>
  <line x1="54" y1="574" x2="906" y2="574" stroke="#444"/>
  <text x="54" y="609" fill="#aaa" font-family="Arial,sans-serif" font-size="14">MEASURE · LOCALIZE · GOVERN</text>
</svg>
