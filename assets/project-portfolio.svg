<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio allocation and annualized return</title>
  <desc id="desc">An allocation graphic showing eighty percent equities, twenty percent bonds, and a 40.43 percent annualized return.</desc>
  <rect width="960" height="640" fill="#111"/>
  <text x="54" y="58" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">PORTFOLIO / 01</text>
  <text x="906" y="58" text-anchor="end" fill="#aaa" font-family="Arial,sans-serif" font-size="14">CAD 1B SIMULATION</text>
  <line x1="54" y1="93" x2="906" y2="93" stroke="#444"/>
  <circle cx="300" cy="336" r="150" fill="none" stroke="#d6d6cf" stroke-width="64"/>
  <circle cx="300" cy="336" r="150" fill="none" stroke="#243b70" stroke-width="64" stroke-dasharray="754 188" transform="rotate(-90 300 336)"/>
  <text x="300" y="326" text-anchor="middle" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="54">80 / 20</text>
  <text x="300" y="361" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="14">EQUITY · BONDS</text>
  <text x="580" y="258" fill="#aaa" font-family="Arial,sans-serif" font-size="14">ANNUALIZED RETURN</text>
  <text x="580" y="342" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="78">40.43%</text>
  <line x1="580" y1="382" x2="906" y2="382" stroke="#444"/>
  <text x="580" y="426" fill="#aaa" font-family="Arial,sans-serif" font-size="14">CLIENT PROFILING</text>
  <text x="580" y="456" fill="#aaa" font-family="Arial,sans-serif" font-size="14">SCREEN · REBALANCE · HEDGE</text>
  <line x1="54" y1="574" x2="906" y2="574" stroke="#444"/>
  <text x="54" y="609" fill="#aaa" font-family="Arial,sans-serif" font-size="14">RISK-ALIGNED ASSET ALLOCATION</text>
</svg>
