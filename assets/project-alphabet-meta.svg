  <text x="906" y="58" text-anchor="end" fill="#aaa" font-family="Arial,sans-serif" font-size="14">ANALYSIS FRAMEWORK</text>
  <line x1="54" y1="93" x2="906" y2="93" stroke="#444"/>
  <text x="54" y="163" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="48">Equity Research Process</text>
  <text x="54" y="205" fill="#777" font-family="Arial,sans-serif" font-size="18">Methodology overview · no comparative results shown</text>

  <g stroke="#5a5a57" stroke-width="2" fill="none">
    <line x1="160" y1="360" x2="270" y2="360"/>
    <line x1="350" y1="360" x2="460" y2="360"/>
    <line x1="540" y1="360" x2="650" y2="360"/>
    <line x1="730" y1="360" x2="840" y2="360"/>
  </g>
  <g fill="#d6d6cf">
    <path d="M265 354l12 6-12 6z"/><path d="M455 354l12 6-12 6z"/>
    <path d="M645 354l12 6-12 6z"/><path d="M835 354l12 6-12 6z"/>
  </g>

  <g font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="110" cy="360" r="58" fill="#243b70"/>
    <text x="110" y="350" fill="#fff" font-size="13">01</text>
    <text x="110" y="376" fill="#fff" font-size="15">FILINGS</text>

    <circle cx="300" cy="360" r="58" fill="#d6d6cf"/>
    <text x="300" y="350" fill="#111" font-size="13">02</text>
    <text x="300" y="376" fill="#111" font-size="15">RETURNS</text>

    <circle cx="490" cy="360" r="58" fill="#d6d6cf"/>
    <text x="490" y="350" fill="#111" font-size="13">03</text>
    <text x="490" y="376" fill="#111" font-size="15">CASH FLOW</text>

    <circle cx="680" cy="360" r="58" fill="#d6d6cf"/>
