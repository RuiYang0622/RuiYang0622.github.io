<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Alphabet and Meta financial comparison</title>
  <desc id="desc">A dark financial dashboard comparing profitability and cash flow metrics.</desc>
  <rect width="960" height="640" fill="#111"/>
  <text x="54" y="58" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">EQUITY RESEARCH / 01</text>
  <text x="906" y="58" text-anchor="end" fill="#aaa" font-family="Arial,sans-serif" font-size="14">ALPHABET × META</text>
  <line x1="54" y1="93" x2="906" y2="93" stroke="#444"/>
  <text x="54" y="153" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="46">Profitability</text>
  <text x="54" y="198" fill="#777" font-family="Arial,sans-serif" font-size="46">Cash flow · Resilience</text>
  <text x="54" y="272" fill="#aaa" font-family="Arial,sans-serif" font-size="14">RELATIVE ANALYSIS</text>
  <rect x="54" y="300" width="340" height="26" fill="#2b447e"/>
  <rect x="54" y="344" width="276" height="26" fill="#d6d6cf"/>
  <text x="412" y="320" fill="#aaa" font-family="Arial,sans-serif" font-size="13">ALPHABET</text>
  <text x="348" y="364" fill="#aaa" font-family="Arial,sans-serif" font-size="13">META</text>
  <line x1="54" y1="420" x2="906" y2="420" stroke="#444"/>
  <text x="54" y="463" fill="#888" font-family="Arial,sans-serif" font-size="13">MARGINS</text>
  <text x="278" y="463" fill="#888" font-family="Arial,sans-serif" font-size="13">ROA / ROE</text>
  <text x="500" y="463" fill="#888" font-family="Arial,sans-serif" font-size="13">FCFF / FCFE</text>
  <text x="728" y="463" fill="#888" font-family="Arial,sans-serif" font-size="13">M&amp;A RISK</text>
  <text x="54" y="535" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="24">Diversified revenue</text>
  <text x="54" y="570" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="24">supports resilience.</text>
  <circle cx="820" cy="535" r="54" fill="none" stroke="#d6d6cf" stroke-width="2"/>
  <circle cx="820" cy="535" r="34" fill="none" stroke="#2b447e" stroke-width="12" stroke-dasharray="150 65" transform="rotate(-90 820 535)"/>
</svg>
