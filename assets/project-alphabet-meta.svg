<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Equity research analysis process</title>
  <desc id="desc">A neutral process diagram showing research stages without comparative findings or company results.</desc>
  <rect width="960" height="640" fill="#111"/>
