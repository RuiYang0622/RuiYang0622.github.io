<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">AEO discounted cash flow valuation</title>
  <desc id="desc">A dark valuation graphic showing cash flows, discounting, and implied upside.</desc>
  <rect width="960" height="640" fill="#111"/>
  <text x="54" y="58" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">VALUATION / 04</text>
  <text x="906" y="58" text-anchor="end" fill="#aaa" font-family="Arial,sans-serif" font-size="14">AEO · DCF</text>
  <line x1="54" y1="93" x2="906" y2="93" stroke="#444"/>
  <text x="54" y="157" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="46">Cash flow → Value</text>
  <g fill="#d6d6cf">
    <rect x="66" y="380" width="80" height="92"/><rect x="181" y="342" width="80" height="130"/>
    <rect x="296" y="303" width="80" height="169"/><rect x="411" y="248" width="80" height="224"/>
  </g>
  <polyline points="106,340 221,294 336,258 451,196 600,226 750,176 896,144" fill="none" stroke="#243b70" stroke-width="8"/>
  <circle cx="896" cy="144" r="10" fill="#f4f4ef"/>
  <text x="594" y="336" fill="#aaa" font-family="Arial,sans-serif" font-size="14">IMPLIED UPSIDE</text>
  <text x="594" y="423" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="86">147%</text>
  <line x1="54" y1="520" x2="906" y2="520" stroke="#444"/>
  <text x="54" y="561" fill="#aaa" font-family="Arial,sans-serif" font-size="14">FCFF / FCFE</text>
  <text x="300" y="561" fill="#aaa" font-family="Arial,sans-serif" font-size="14">WACC</text>
  <text x="506" y="561" fill="#aaa" font-family="Arial,sans-serif" font-size="14">SENSITIVITY</text>
  <text x="758" y="561" fill="#aaa" font-family="Arial,sans-serif" font-size="14">SCENARIOS</text>
</svg>
